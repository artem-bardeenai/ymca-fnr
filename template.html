};

// Known female swimmers (we'll auto-detect from common names, but this helps)
const FEMALE_NAMES = new Set(['Natalie','Neya','Olivia','Fiona','Lily','Kaia','Madison','Manon','Emma','Anna','Penelope','Vivian','Lillian','Lucy','Alessia','Lara','Andi','Katrina','Mia','Sofia','Sarah','Emily','Sophia','Isabella','Grace','Ava','Chloe','Ella','Abigail','Hannah','Victoria','Nora','Lena','Mila','Iris','Ruby','Alice','Aria','Luna','Stella','Violet','Hazel','Ivy','Piper','Quinn','Willow','Aurora','Savannah','Brooklyn','Leah','Zoe','Addison','Aubrey','Eleanor','Paisley','Bella','Claire','Skylar','Maya','Caroline','Layla','Madelyn','Ellie','Hailey','Aaliyah','Riley','Gabriella','Sadie','Audrey','Naomi','Allison','Samantha','Natalia','Eva','Valentina']);

let showStandards = false;

function getAgeGroup(age) {
  if (age <= 10) return '10U';
  if (age <= 12) return '11-12';
  if (age <= 14) return '13-14';
  if (age <= 16) return '15-16';
  return '17-18';
}

function getGender(firstName) {
  return FEMALE_NAMES.has(firstName) ? 'F' : 'M';
}

function getTimeStandard(firstName, age, event, timeSecs) {
  if (!timeSecs || timeSecs <= 0) return null;
  const gender = getGender(firstName);
  const ageGroup = getAgeGroup(age);
  const stds = TIME_STANDARDS[gender]?.[ageGroup]?.[event];
  if (!stds) return null;
  const levels = ['FUT','AAAA','AAA','AA','A','BB','B'];
  for (const lvl of levels) {
    if (stds[lvl] && timeSecs <= stds[lvl]) return lvl;
  }
  return null;
}

function getNextStandard(firstName, age, event, timeSecs) {
  if (!timeSecs || timeSecs <= 0) return null;
  const gender = getGender(firstName);
  const ageGroup = getAgeGroup(age);
  const stds = TIME_STANDARDS[gender]?.[ageGroup]?.[event];
  if (!stds) return null;
  const levels = ['B','BB','A','AA','AAA','AAAA','FUT'];
  for (const lvl of levels) {
    if (stds[lvl] && timeSecs > stds[lvl]) return { level: lvl, time: stds[lvl], gap: timeSecs - stds[lvl] };
  }
  return null;
}

// ── Auth ──
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function deriveKey(pw) {
  const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: new TextEncoder().encode('pirates'), iterations: 100000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}

async function decrypt(encB64, pw) {
  const buf = Uint8Array.from(atob(encB64), c => c.charCodeAt(0));
  const iv = buf.slice(0, 12);
  const ciphertextAndTag = buf.slice(12);
  const key = await deriveKey(pw);
  const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertextAndTag);
  return new TextDecoder().decode(dec);
}

let _password = null;

async function checkPassword(e) {
  e.preventDefault();
  const pw = document.getElementById('pwInput').value;
  const hash = await sha256(pw);
  if (hash === PASSWORD_HASH) {
    _password = pw;
    localStorage.setItem('pirates_auth', hash);
    localStorage.setItem('pirates_pw', pw);
    unlock();
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
  }
  return false;
}

async function unlock() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  init();
}

(async () => {
  const storedPw = localStorage.getItem('pirates_pw');
  if (localStorage.getItem('pirates_auth') === PASSWORD_HASH && storedPw) {
    _password = storedPw;
    unlock();
  } else {
    localStorage.removeItem('pirates_auth');
  }
})();

// ── Data ──
let SHEET_CSV_URL = null;
let allData = [];
let raceDates = [];
let currentChart = null;

let _initDone = false;
async function init() {
  if (_initDone) return;
  _initDone = true;
  try {
    SHEET_CSV_URL = await decrypt(ENC_CSV_URL, _password);
    const editUrl = await decrypt(ENC_EDIT_URL, _password);
    document.getElementById('sheetLink').href = editUrl;
    const resp = await fetch(SHEET_CSV_URL);
    if (!resp.ok) throw new Error('Failed to fetch sheet');
    const text = await resp.text();
    parseCSV(text);
    populateDropdown();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    // Handle deep link
    handleDeepLink();
  } catch (e) {
    _initDone = false;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').textContent = 'Could not load data: ' + e.message + '. Make sure the Google Sheet is publicly shared.';
    document.getElementById('error').style.display = 'block';
  }
}

function parseCSV(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  const header = parseCSVLine(lines[0]);
  raceDates = header.slice(7);
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    if (cols.length < 5) continue;
    allData.push({
      lane: cols[0], last: cols[1], first: cols[2],
      age: parseInt(cols[3]) || 0, event: cols[4],
      prevSeasonBest: cols[5] || '', currentBest: cols[6] || '',
      times: cols.slice(7)
    });
  }
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"' && line[i+1] === '"') { current += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { result.push(current); current = ''; }
      else { current += ch; }
    }
  }
  result.push(current);
  return result;
}

function getSwimmers() {
  const map = new Map();
  for (const row of allData) {
    const key = row.last + '|' + row.first;
    if (!map.has(key)) map.set(key, { first: row.first, last: row.last, age: row.age, lane: row.lane });
  }
  return [...map.values()].sort((a, b) => (a.first + ' ' + a.last).localeCompare(b.first + ' ' + b.last));
}

function populateDropdown() {
  const sel = document.getElementById('swimmerPicker');
  const swimmers = getSwimmers();
  const groups = {};
  for (const s of swimmers) {
    if (!groups[s.lane]) groups[s.lane] = [];
    groups[s.lane].push(s);
  }
  for (const lane of Object.keys(groups).sort()) {
    const optgroup = document.createElement('optgroup');
    optgroup.label = lane;
    for (const s of groups[lane]) {
      const opt = document.createElement('option');
      opt.value = s.last + '|' + s.first;
      opt.textContent = s.first + ' ' + s.last + ' (age ' + s.age + ')';
      optgroup.appendChild(opt);
    }
    sel.appendChild(optgroup);
  }
  sel.addEventListener('change', () => {
    if (sel.value) {
      renderSwimmer(sel.value);
      // Update URL without reload
      const [last, first] = sel.value.split('|');
      const url = new URL(window.location);
      url.searchParams.set('swimmer', last + ',' + first);
      history.replaceState(null, '', url);
    } else {
      document.getElementById('swimmerView').innerHTML = '';
      history.replaceState(null, '', window.location.pathname);
    }
  });
}

function handleDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const swimmer = params.get('swimmer');
  if (swimmer) {
    const [last, first] = swimmer.split(',');
    const key = last + '|' + first;
    const sel = document.getElementById('swimmerPicker');
    if ([...sel.options].some(o => o.value === key)) {
      sel.value = key;
      renderSwimmer(key);
    }
  }
}

function parseTime(str) {
  if (!str || str === 'NT' || str === '00:00.00' || str.trim() === '') return null;
  str = str.trim();
  const parts = str.split(':');
  if (parts.length === 2) {
    const mins = parseInt(parts[0]);
    const secs = parseFloat(parts[1]);
    if (isNaN(mins) || isNaN(secs)) return null;
    const total = mins * 60 + secs;
    if (total > 120) return null;
    return total;
  }
  const val = parseFloat(str);
  return isNaN(val) ? null : val;
}

function formatTime(secs) {
  if (secs == null) return '--';
  const mins = Math.floor(secs / 60);
  const s = (secs % 60).toFixed(2);
  return mins > 0 ? mins + ':' + s.padStart(5, '0') : '0:' + s.padStart(5, '0');
}

function formatDelta(secs) {
  if (secs == null) return '--';
  const sign = secs <= 0 ? '' : '+';
  return sign + secs.toFixed(2);
}

function getSwimmerRows(key) {
  const [last, first] = key.split('|');
  return allData.filter(r => r.last === last && r.first === first);
}

const EVENT_COLORS = {
  '50 Fly':    { bg: 'rgba(99,102,241,0.15)', border: '#6366f1' },
  '50 Back':   { bg: 'rgba(16,185,129,0.15)', border: '#10b981' },
  '50 Breast': { bg: 'rgba(245,158,11,0.15)', border: '#f59e0b' },
  '50 Free':   { bg: 'rgba(37,99,235,0.15)',  border: '#2563eb' },
};


// ── Render ──
function renderSwimmer(key) {
  const rows = getSwimmerRows(key);
  if (!rows.length) return;
  const info = rows[0];
  const events = [...new Set(rows.map(r => r.event))];

  let html = '';

  // ── Header with share button ──
  html += `<div class="swimmer-header">
    <div>
      <h2>${info.first} ${info.last}</h2>
    </div>
    <div class="meta">
      <span class="badge badge-lane">${info.lane}</span>
      <span class="badge badge-age">Age ${info.age}</span>
      <button class="share-btn" onclick="shareSwimmer('${info.last}','${info.first}', this)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        Share
      </button>
    </div>
  </div>`;

  // ── Event Improvement Summary ──
  const lastDateIdx = raceDates.length - 1;
  let prevDateIdx = -1;
  // Find second-to-last date this swimmer has data for
  for (let i = lastDateIdx - 1; i >= 0; i--) {
    if (rows.some(r => parseTime(r.times[i]) !== null)) { prevDateIdx = i; break; }
  }
  const lastMeetDate = raceDates[lastDateIdx];
  let improved = 0, declined = 0, noChange = 0, noData = 0;
  let totalDrop = 0;
  for (const ev of events) {
    const row = rows.find(r => r.event === ev);
    const lastTime = parseTime(row.times[lastDateIdx]);
    const prevTime = prevDateIdx >= 0 ? parseTime(row.times[prevDateIdx]) : null;
    if (lastTime && prevTime) {
      const diff = lastTime - prevTime;
      totalDrop += diff;
      if (diff < -0.01) improved++;
      else if (diff > 0.01) declined++;
      else noChange++;
    } else {
      noData++;
    }
  }

  html += `<div class="card">
    <h3>Last Meet Summary${lastMeetDate ? ' — ' + lastMeetDate : ''}</h3>
    <div class="summary-grid">
      <div class="summary-stat ${improved > 0 ? 'good' : 'neutral'}"><div class="value">${improved}/${events.length}</div><div class="label">Events Improved</div></div>
      <div class="summary-stat ${declined > 0 ? 'bad' : 'neutral'}"><div class="value">${declined}/${events.length}</div><div class="label">Events Slower</div></div>
      <div class="summary-stat ${totalDrop < 0 ? 'good' : totalDrop > 0 ? 'bad' : 'neutral'}"><div class="value">${totalDrop <= 0 ? '' : '+'}${totalDrop.toFixed(2)}s</div><div class="label">Total Time Change</div></div>
    </div>
  </div>`;

  // ── Personal Bests with standards toggle ──
  html += `<div class="card">
    <h3 style="justify-content:space-between;flex-wrap:wrap;">
      <span>Personal Bests</span>
      <div class="toggle-row">
        <span>USA Standards</span>
        <div class="toggle-switch ${showStandards ? 'on' : ''}" id="stdToggle" onclick="toggleStandards()"></div>
      </div>
    </h3>
    <div id="bestTimesContent">`;
  html += renderBestTimes(rows, events, info);
  html += `</div></div>`;

  // ── All Events Chart ──
  html += `<div class="card">
    <h3>All Events Progress</h3>
    <div class="chart-container"><canvas id="allEventsChart"></canvas></div>
  </div>`;

  // ── Single Event Chart ──
  html += `<div class="card">
    <h3>Single Event Progress</h3>
    <div class="event-tabs" id="eventTabs"></div>
    <div class="chart-container"><canvas id="progressChart"></canvas></div>
  </div>`;

  // ── Meet-over-Meet Delta Table ──
  html += `<div class="card">
    <h3>Meet-over-Meet Changes</h3>
    <div class="overflow-x">${renderDeltaTable(rows, events)}</div>
  </div>`;

  // ── Age Group Percentiles ──
  html += `<div class="card">
    <h3>Age Group Percentiles</h3>
    ${renderPercentiles(key, rows, events, info)}
  </div>`;

  // ── Rankings section ──
  html += `<div class="card">
    <h3>Team Rankings</h3>
    <div class="view-toggle">
      <button class="view-btn active" data-scope="lane" onclick="setRankingScope('lane', this)">Same Group</button>
      <button class="view-btn" data-scope="age" onclick="setRankingScope('age', this)">Same Age</button>
      <button class="view-btn" data-scope="all" onclick="setRankingScope('all', this)">All Swimmers</button>
    </div>
    <div class="event-tabs" id="rankEventTabs"></div>
    <div id="rankingTable"></div>
  </div>`;

  document.getElementById('swimmerView').innerHTML = html;
  // ── Draw all-events chart ──
  drawAllEventsChart(key, events);

  // ── Setup single event tabs ──
  const tabsEl = document.getElementById('eventTabs');
  events.forEach((ev, i) => {
    const btn = document.createElement('button');
    btn.className = 'event-tab' + (i === 0 ? ' active' : '');
    btn.textContent = ev.replace('50 ', '');
    btn.onclick = () => {
      tabsEl.querySelectorAll('.event-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      drawChart(key, ev);
    };
    tabsEl.appendChild(btn);
  });
  drawChart(key, events[0]);

  // ── Ranking tabs ──
  const rankTabsEl = document.getElementById('rankEventTabs');
  events.forEach((ev, i) => {
    const btn = document.createElement('button');
    btn.className = 'event-tab' + (i === 0 ? ' active' : '');
    btn.textContent = ev.replace('50 ', '');
    btn.onclick = () => {
      rankTabsEl.querySelectorAll('.event-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      window._currentRankEvent = ev;
      drawRanking(key, ev, window._currentRankScope || 'lane');
    };
    rankTabsEl.appendChild(btn);
  });
  window._currentRankEvent = events[0];
  window._currentRankScope = 'lane';
  drawRanking(key, events[0], 'lane');

}

function renderBestTimes(rows, events, info) {
  let html = '';
  for (const ev of events) {
    const row = rows.find(r => r.event === ev);
    const best = parseTime(row.currentBest);
    const prevBest = parseTime(row.prevSeasonBest);
    let improvHtml = '';
    if (best && prevBest && prevBest > 0) {
      const diff = best - prevBest;
      if (diff < 0) improvHtml = `<span class="improvement positive">${diff.toFixed(2)}s vs last season</span>`;
      else if (diff > 0) improvHtml = `<span class="improvement negative">+${diff.toFixed(2)}s vs last season</span>`;
    }
    let stdHtml = '';
    if (showStandards && best) {
      const std = getTimeStandard(info.first, info.age, ev, best);
      if (std) stdHtml = `<span class="std-badge std-${std}">${std}</span>`;
      const next = getNextStandard(info.first, info.age, ev, best);
      if (next) stdHtml += `<span style="font-size:0.7rem;color:var(--gray-500);margin-left:0.35rem">${next.gap.toFixed(2)}s to ${next.level}</span>`;
    }
    html += `<div class="best-time-row">
      <span class="event-name">${ev}</span>
      <span class="time-info">
        <span class="time">${best ? formatTime(best) : '--'}</span>
        ${stdHtml}${improvHtml}
      </span>
    </div>`;
  }
  return html;
}

window.toggleStandards = function() {
  showStandards = !showStandards;
  const toggle = document.getElementById('stdToggle');
  if (toggle) toggle.classList.toggle('on', showStandards);
  // Re-render best times
  const key = document.getElementById('swimmerPicker').value;
  if (key) {
    const rows = getSwimmerRows(key);
    const events = [...new Set(rows.map(r => r.event))];
    const info = rows[0];
    document.getElementById('bestTimesContent').innerHTML = renderBestTimes(rows, events, info);
  }
};

function renderDeltaTable(rows, events) {
  // Build table: rows = events, cols = race dates, cells = delta from previous
  let html = `<table class="delta-table"><thead><tr><th>Event</th>`;
  for (const d of raceDates) {
    html += `<th>${d}</th>`;
  }
  html += `</tr></thead><tbody>`;

  for (const ev of events) {
    const row = rows.find(r => r.event === ev);
    html += `<tr><td class="event-col">${ev.replace('50 ', '')}</td>`;
    let prevTime = null;
    // Find best up to that point for PB detection
    let bestSoFar = Infinity;
    for (let i = 0; i < raceDates.length; i++) {
      const t = parseTime(row.times[i]);
      if (t === null) {
        html += `<td class="delta-na">--</td>`;
      } else {
        const isPB = t < bestSoFar;
        if (t < bestSoFar) bestSoFar = t;
        if (prevTime === null) {
          html += `<td>${formatTime(t)}${isPB ? '<span class="delta-pb"> PB</span>' : ''}</td>`;
        } else {
          const delta = t - prevTime;
          const cls = delta < -0.01 ? 'delta-pos' : delta > 0.01 ? 'delta-neg' : '';
          html += `<td><span class="${cls}">${formatDelta(delta)}</span>${isPB ? '<span class="delta-pb"> PB</span>' : ''}</td>`;
        }
        prevTime = t;
      }
    }
    html += `</tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

function renderPercentiles(key, rows, events, info) {
  // Calculate percentile among same-age swimmers for each event
  let html = '';
  for (const ev of events) {
    const row = rows.find(r => r.event === ev);
    const best = parseTime(row.currentBest);
    if (!best || best <= 0) {
      html += `<div class="best-time-row"><span class="event-name">${ev}</span><span class="percentile-text">No data</span></div>`;
      continue;
    }

    // All swimmers same age with valid best for this event
    const sameAge = allData.filter(r => r.age === info.age && r.event === ev);
    const times = [];
    const seen = new Set();
    for (const r of sameAge) {
      const k = r.last + '|' + r.first;
      if (seen.has(k)) continue;
      seen.add(k);
      const t = parseTime(r.currentBest);
      if (t && t > 0) times.push(t);
    }
    times.sort((a, b) => a - b);
    const rank = times.indexOf(best) + 1;
    const pct = Math.round((1 - (rank - 1) / times.length) * 100);
    const barWidth = Math.max(5, pct);

    html += `<div class="best-time-row">
      <span class="event-name">${ev}</span>
      <span style="display:flex;align-items:center;">
        <span style="font-size:0.8rem;font-weight:600;min-width:2rem;text-align:right;">#${rank}</span>
        <span style="font-size:0.75rem;color:var(--gray-500);margin:0 0.5rem;">of ${times.length}</span>
        <span class="percentile-bar-container"><span class="percentile-bar" style="width:${barWidth}%"></span></span>
        <span class="percentile-text">Top ${pct <= 0 ? 1 : pct}%</span>
      </span>
    </div>`;
  }
  return html;
}

// ── Share ──
window.shareSwimmer = function(last, first, btn) {
  const url = new URL(window.location);
  url.searchParams.set('swimmer', last + ',' + first);
  navigator.clipboard.writeText(url.toString()).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Share';
    }, 2000);
  });
};

// ── Charts ──
function drawAllEventsChart(key, events) {
  const rows = getSwimmerRows(key);
  const datasets = [];
  for (const ev of events) {
    const row = rows.find(r => r.event === ev);
    if (!row) continue;
    const colors = EVENT_COLORS[ev];
    const data = [];
    for (let i = 0; i < raceDates.length; i++) {
      data.push(parseTime(row.times[i]));
    }
    datasets.push({
      label: ev,
      data,
      borderColor: colors.border,
      backgroundColor: colors.bg,
      borderWidth: 2,
      pointRadius: 4,
      pointBackgroundColor: colors.border,
      spanGaps: true,
      tension: 0.3,
    });
  }

  const ctx = document.getElementById('allEventsChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: { labels: raceDates, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + formatTime(ctx.parsed.y) } }
      },
      scales: {
        y: {
          reverse: true,
          title: { display: true, text: 'Time (lower is better)' },
          ticks: { callback: v => formatTime(v) }
        }
      }
    }
  });
}

function drawChart(key, event) {
  const rows = getSwimmerRows(key);
  const row = rows.find(r => r.event === event);
  if (!row) return;

  const labels = [];
  const data = [];
  for (let i = 0; i < raceDates.length; i++) {
    const t = parseTime(row.times[i]);
    if (t !== null) {
      labels.push(raceDates[i]);
      data.push(t);
    }
  }

  const colors = EVENT_COLORS[event] || { bg: 'rgba(37,99,235,0.15)', border: '#2563eb' };

  if (currentChart) currentChart.destroy();
  const ctx = document.getElementById('progressChart').getContext('2d');
  currentChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: event,
        data,
        borderColor: colors.border,
        backgroundColor: colors.bg,
        borderWidth: 2.5,
        pointRadius: 5,
        pointBackgroundColor: colors.border,
        fill: true,
        tension: 0.3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => formatTime(ctx.parsed.y) } }
      },
      scales: {
        y: {
          reverse: true,
          title: { display: true, text: 'Time (lower is better)' },
          ticks: { callback: v => formatTime(v) }
        }
      }
    }
  });
}

// ── Rankings ──
window.setRankingScope = function(scope, btn) {
  btn.parentElement.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  window._currentRankScope = scope;
  const key = document.getElementById('swimmerPicker').value;
  drawRanking(key, window._currentRankEvent, scope);
};

function drawRanking(selectedKey, event, scope) {
  const [selLast, selFirst] = selectedKey.split('|');
  const selRow = allData.find(r => r.last === selLast && r.first === selFirst && r.event === event);
  if (!selRow) return;

  let candidates = allData.filter(r => r.event === event);
  if (scope === 'lane') candidates = candidates.filter(r => r.lane === selRow.lane);
  else if (scope === 'age') candidates = candidates.filter(r => r.age === selRow.age);

  const swimmerBests = [];
  const seen = new Set();
  for (const r of candidates) {
    const k = r.last + '|' + r.first;
    if (seen.has(k)) continue;
    seen.add(k);
    const best = parseTime(r.currentBest);
    if (best && best > 0) swimmerBests.push({ key: k, first: r.first, last: r.last, age: r.age, lane: r.lane, best });
  }
  swimmerBests.sort((a, b) => a.best - b.best);

  let tableHtml = `<table class="ranking-table">
    <thead><tr><th>#</th><th>Swimmer</th><th>Age</th><th>Group</th><th>Best Time</th></tr></thead><tbody>`;
  swimmerBests.forEach((s, i) => {
    const isSelected = s.key === selectedKey;
    const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
    tableHtml += `<tr class="${isSelected ? 'highlight' : ''}">
      <td class="rank ${rankClass}">${i + 1}</td>
      <td>${s.first} ${s.last}</td>
      <td>${s.age}</td>
      <td>${s.lane}</td>
      <td class="time-cell">${formatTime(s.best)}</td>
    </tr>`;
  });
  tableHtml += `</tbody></table>`;
  document.getElementById('rankingTable').innerHTML = tableHtml;
}

// ── Compare ──
init();
